services:

  # ── PostgreSQL ──────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: azt_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       AZT_DB
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: "12345"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d AZT_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── ASP.NET Core App ────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: azt_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=AZT_DB;Username=postgres;Password=12345"
      Jwt__Issuer:    "AZT_Backend"
      Jwt__Audience:  "AZT_Users"
      Jwt__SecretKey: "DayLaMotChuoiBiMatRatDaiVaAnToanChoJWT123456!@#"
    volumes:
      - uploads_data:/app/wwwroot/uploads
    ports:
      - "8080:8080"

  # ── Vite React Frontend ─────────────────────────────────────
  frontend:
    image: azt_frontend_image
    build:
      context: ./ICT_FE
      dockerfile: Dockerfile
      args:
        # Pass the backend URL through so it burns into Vite build!
        VITE_API_BASE_URL: http://localhost:8080
    container_name: azt_frontend
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"

volumes:
  postgres_data:
  uploads_data: